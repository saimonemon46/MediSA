services:
  # ------------------------------------------------------------
  # Database Service (MariaDB 11.8)
  # ------------------------------------------------------------
  db:
    image: mariadb:11.8
    container_name: medisa_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mediai_db
    ports:
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - medisa_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------
  # FastAPI AI Microservice (Python / LangGraph / FAISS / Vision)
  # ------------------------------------------------------------
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: medisa_ai
    restart: unless-stopped
    ports:
      - "${HOST_AI_PORT:-8000}:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-2.5-flash-lite}
    volumes:
      - medisa_uploads:/app/backend_django/uploads
      - ./vector_store:/app/vector_store
    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------------------------------
  # Django Application Backend (Python 3.12 / REST API)
  # ------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: medisa_backend
    restart: unless-stopped
    ports:
      - "${HOST_DJANGO_PORT:-8082}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=mediai_db
      - DB_USER=root
      - DB_PASS=password
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - medisa_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------------------------------
  # Next.js Frontend Web Application (Node.js 20 / React)
  # ------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        - DJANGO_URL=http://backend:8080
        - AI_URL=http://ai-service:8000
    container_name: medisa_frontend
    restart: unless-stopped
    ports:
      - "${HOST_WEB_PORT:-3000}:3000"
    environment:
      - DJANGO_URL=http://backend:8080
      - AI_URL=http://ai-service:8000
      - NEXT_PUBLIC_DJANGO_URL=http://localhost:8082
      - NEXT_PUBLIC_AI_URL=http://localhost:8000
    depends_on:
      - backend
      - ai-service

volumes:
  medisa_db_data:
  medisa_uploads:
