services:
  # ------------------------------------------------------------
  # Database Service (MariaDB 11.8)
  # ------------------------------------------------------------
  db:
    image: mariadb:11.8
    container_name: medisa_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mediai_db
    ports:
      # Exposed on host port 3307 to avoid collisions with any existing host MySQL on 3306
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - medisa_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------
  # FastAPI AI Microservice (Python / LangGraph / FAISS / Vision)
  # ------------------------------------------------------------
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: medisa_ai
    restart: unless-stopped
    ports:
      - "${HOST_AI_PORT:-8005}:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-2.5-flash-lite}
    volumes:
      - medisa_uploads:/app/backend_php/uploads
      - medisa_vector_store:/app/vector_store
    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------------------------------
  # Web UI & PHP Application Backend (Apache + PHP 8.2)
  # ------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: medisa_web
    restart: unless-stopped
    ports:
      - "${HOST_WEB_PORT:-3000}:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=mediai_db
      - DB_USER=root
      - DB_PASS=password
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - medisa_uploads:/var/www/html/backend_php/uploads
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  medisa_db_data:
  medisa_uploads:
  medisa_vector_store:
