name: MediSA CI Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  test-ai:
    name: AI Service & Triage Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PyTorch CPU & Dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run MediSA Enhancement Tests
        run: |
          python test_enhancements.py

  test-django:
    name: Django Backend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Django Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend_django/requirements.txt

      - name: Check Django Configuration & Migrations
        working-directory: ./backend_django
        run: |
          python manage.py check

  build-frontend:
    name: Next.js Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend_next/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend_next
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend_next
        env:
          DJANGO_URL: http://localhost:8080
          AI_URL: http://localhost:8000
        run: npm run build
